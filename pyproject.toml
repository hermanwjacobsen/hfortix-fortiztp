[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hfortix-fortiztp"
version = "0.5.164"
description = "FortiZTP Cloud API Client - Device provisioning and management"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Herman W. Jacobsen", email = "herman@wjacobsen.fo"}
]
maintainers = [
    {name = "Herman W. Jacobsen", email = "herman@wjacobsen.fo"}
]
keywords = ["fortinet", "fortiztp", "api", "client", "provisioning", "zero-touch", "fortigate", "fortiap", "fortiswitch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "hfortix-core>=0.5.161",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "pyright>=1.1.0",
]

[project.urls]
Homepage = "https://github.com/hermanwjacobsen/hfortix-fortiztp"
Documentation = "https://hfortix.readthedocs.io"
Repository = "https://github.com/hermanwjacobsen/hfortix-fortiztp"
Issues = "https://github.com/hermanwjacobsen/hfortix-fortiztp/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["hfortix_fortiztp*"]
exclude = ["docs*"]

[tool.setuptools.package-data]
hfortix_fortiztp = ["py.typed", "*.pyi", "**/*.pyi"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_calls = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
strict_concatenate = true

[tool.pyright]
include = ["hfortix_fortiztp"]
exclude = ["**/__pycache__", "**/.pytest_cache"]
pythonVersion = "3.9"
typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = false
